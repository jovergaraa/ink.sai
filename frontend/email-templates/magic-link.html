<!--
  ink·sai — Magic link
  Pegar en Supabase: Authentication → Email Templates → Magic link
  No cambiar la variable {{ .ConfirmationURL }}.
  Nota (KAN-29): no se usa hoy en el flujo de la app, pero Supabase la envía si algo la dispara.
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tu enlace de acceso — ink·sai</title>
  </head>
  <body style="margin:0; padding:0; background-color:#F2EEE7; font-family:Georgia, 'Times New Roman', serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F2EEE7;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="width:480px; max-width:100%; background-color:#F2EEE7;">

            <!-- Header -->
            <tr>
              <td align="center" style="background-color:#1B1815; padding:40px 24px;">
                <div style="font-family:'Times New Roman', Georgia, serif; font-style:italic; font-size:30px; line-height:1; color:#F2EEE7; letter-spacing:0.5px;">
                  ink&middot;sai
                </div>
                <div style="margin-top:10px; font-family:'Courier New', monospace; font-size:10px; letter-spacing:3px; color:#A79F92; text-transform:uppercase;">
                  Estudio de tatuajes
                </div>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:40px 32px 8px 32px;">
                <div style="font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:26px; color:#1B1815;">
                  Tu entrada sin llave
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 0 32px; font-family:Georgia, 'Times New Roman', serif; font-size:15px; line-height:1.6; color:#1B1815;">
                Usa este enlace para entrar directamente al estudio, sin contraseña.
              </td>
            </tr>

            <!-- Botón -->
            <tr>
              <td align="center" style="padding:32px 32px 8px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                  <tr>
                    <td align="center" bgcolor="#1B1815" style="background-color:#1B1815;">
                      <a href="{{ .ConfirmationURL }}"
                         style="display:block; padding:16px 24px; font-family:'Courier New', monospace; font-size:12px; letter-spacing:3px; color:#F2EEE7; text-decoration:none; text-transform:uppercase;">
                        Entrar al estudio
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Aviso: barra de tinta -->
            <tr>
              <td style="padding:32px 32px 0 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                  <tr>
                    <td width="2" bgcolor="#1B1815" style="background-color:#1B1815;">&nbsp;</td>
                    <td style="padding:0 0 0 12px; font-family:'Courier New', monospace; font-size:11px; line-height:1.6; color:#7A7268;">
                      Este enlace vence en 1 hora y solo puede usarse una vez. Si no lo pediste, ignora este correo.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Separador + fallback de enlace -->
            <tr>
              <td style="padding:32px 32px 0 32px;">
                <div style="border-top:1px solid #E4DED2;"></div>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 40px 32px; font-family:'Courier New', monospace; font-size:10px; letter-spacing:1.5px; color:#A79F92; text-transform:uppercase;">
                Si el botón no funciona
                <div style="margin-top:8px; font-family:Georgia, serif; font-size:12px; letter-spacing:normal; color:#7A7268; text-transform:none; word-break:break-all;">
                  {{ .ConfirmationURL }}
                </div>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
